server {
    listen 80;
    listen [::]:80;

    server_name arc.natsai.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name arc.natsai.xyz;

    ssl_certificate /etc/letsencrypt/live/arc.natsai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arc.natsai.xyz/privkey.pem;

    root /var/www/arc.natsai.xyz;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        limit_req zone=arc_obs_api burst=30 nodelay;
        limit_conn arc_obs_conn 10;

        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
